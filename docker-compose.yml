services:
  ledgerlift:
    image: ezetina86/ledgerlift:${TAG:-latest}
    build:
      context: .           # repo root so Dockerfile can access both frontend/ and backend/
      dockerfile: backend/Dockerfile
    container_name: ledgerlift
    restart: unless-stopped
    ports:
      - "9090:9090"
    env_file:
      - ./atlas-credentials.env
    environment:
      - PORT=9090
      - MONGODB_DB=ledgerlift
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
