# CD Prod — build + push production image to Docker Hub
#
# Triggers:
#   - Push to `master`
#   - Version tag push (v*.*.*)
#
# Pipeline:
#   lint-frontend ──┐
#   lint-backend  ──┼── test-frontend ──┐
#                   │   test-backend  ──┼── build-frontend ── docker-publish
#                   └───────────────────┘
#
# Image tags produced:
#   ezetina86/ledgerlift:latest          (master push)
#   ezetina86/ledgerlift:0.6.0           (v* tag — semver)
#   ezetina86/ledgerlift:0.6             (v* tag — major.minor)
#   ezetina86/ledgerlift:<sha>           (always)
#
# Required GitHub Actions secrets:
#   DOCKERHUB_TOKEN  — Docker Hub access token (Account Settings → Security)
#                      Username is hardcoded as ezetina86

name: CD Prod

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"

# Never run two production publishes concurrently.
concurrency:
  group: cd-prod
  cancel-in-progress: false

env:
  IMAGE: ezetina86/ledgerlift

jobs:

  # ── Lint & type-check: frontend ─────────────────────────────────────────────
  lint-frontend:
    name: Lint & type-check (frontend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: TypeScript type-check
        working-directory: frontend
        run: bun run tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: bun run lint

  # ── Lint & vet: backend ──────────────────────────────────────────────────────
  lint-backend:
    name: Lint & vet (backend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        working-directory: backend
        run: go vet ./...

  # ── Test: frontend ───────────────────────────────────────────────────────────
  test-frontend:
    name: Test (frontend — Vitest)
    runs-on: ubuntu-latest
    needs: [lint-frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run Vitest suite
        working-directory: frontend
        run: bun run test

  # ── Test: backend ────────────────────────────────────────────────────────────
  test-backend:
    name: Test (backend — Go)
    runs-on: ubuntu-latest
    needs: [lint-backend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run Go tests
        working-directory: backend
        env:
          CGO_ENABLED: "0"
        run: go test -v ./...

  # ── Build: frontend ──────────────────────────────────────────────────────────
  build-frontend:
    name: Build frontend (Vite)
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build (tsc + vite)
        working-directory: frontend
        run: bun run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/
          retention-days: 7

  # ── Docker publish: Docker Hub ───────────────────────────────────────────────
  docker-publish:
    name: Docker publish → Docker Hub
    runs-on: ubuntu-latest
    needs: [build-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ezetina86
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # semver tags from v*.*.* git tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # short SHA — always present for rollback
            type=sha,prefix=,format=short
            # :latest only on master branch pushes
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
