# CD Prod — production image publish + optional home-lab deploy
# Triggered on push to `master` or on a version tag (`v*.*.*`).
#
# Pipeline:
#   lint-frontend ──┐
#   lint-backend  ──┼── test-frontend ──┐
#                   │   test-backend  ──┼── build-frontend ── docker-publish-prod ── deploy-homelab
#                   └───────────────────┘
#
# Docker image tags produced:
#   ledgerlift:latest
#   ledgerlift:<semver tag>   (when triggered by v* tag)
#   ledgerlift:<git-sha>      (always)
#
# Images are pushed to GitHub Container Registry (ghcr.io).
#
# Required GitHub Actions secrets:
#   GHCR_TOKEN          — Personal Access Token with `write:packages` scope
#                         (or rely on GITHUB_TOKEN with packages:write)
#
# Optional secrets for home-lab SSH deploy (see deploy-homelab job below):
#   HOMELAB_SSH_HOST    — IP address or hostname of the home-lab server
#   HOMELAB_SSH_USER    — SSH username (e.g. deploy)
#   HOMELAB_SSH_KEY     — Private key PEM (contents of ~/.ssh/id_ed25519)
#   HOMELAB_SSH_PORT    — SSH port (default 22)
#   HOMELAB_DEPLOY_PATH — Absolute path to docker-compose project on server
#                         (e.g. /opt/ledgerlift)

name: CD Prod

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"

# Never run two production deploys concurrently.
concurrency:
  group: cd-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ledgerlift

jobs:

  # ── Lint & type-check: frontend ───────────────────────────────────────────
  lint-frontend:
    name: Lint & type-check (frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: TypeScript type-check
        working-directory: frontend
        run: bun run tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: bun run lint

  # ── Lint & vet: backend ───────────────────────────────────────────────────
  lint-backend:
    name: Lint & vet (backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        working-directory: backend
        run: go vet ./...

  # ── Test: frontend ────────────────────────────────────────────────────────
  test-frontend:
    name: Test (frontend — Vitest)
    runs-on: ubuntu-latest
    needs: [lint-frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run Vitest suite
        working-directory: frontend
        run: bun run test

  # ── Test: backend ─────────────────────────────────────────────────────────
  test-backend:
    name: Test (backend — Go)
    runs-on: ubuntu-latest
    needs: [lint-backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run Go tests
        working-directory: backend
        env:
          CGO_ENABLED: "0"
        run: go test -v -race ./...

  # ── Build: frontend ───────────────────────────────────────────────────────
  build-frontend:
    name: Build frontend (Vite)
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build (tsc + vite)
        working-directory: frontend
        run: bun run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/
          retention-days: 7

  # ── Docker publish: production ────────────────────────────────────────────
  docker-publish-prod:
    name: Docker publish (production)
    runs-on: ubuntu-latest
    needs: [build-frontend]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with semver when triggered by a v* tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Always tag with the git SHA for rollback
            type=sha,prefix=,format=short
            # latest only on master branch pushes (not tags alone)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy: home lab (SSH) ────────────────────────────────────────────────
  # This job is disabled until you fill in the HOMELAB_* secrets below.
  # To enable: remove the `if: false` condition and set the secrets in
  # Settings → Secrets and variables → Actions.
  #
  # Deploy strategy:
  #   1. SSH to home-lab server
  #   2. Run `make backup` to snapshot the live SQLite DB before any change
  #   3. Pull the new image from ghcr.io
  #   4. Recreate the container with `docker compose up --force-recreate -d`
  #
  # This is idempotent — safe to re-run at any time.
  deploy-homelab:
    name: Deploy to home lab
    runs-on: ubuntu-latest
    needs: [docker-publish-prod]
    # -------------------------------------------------------------------
    # CHANGE `if: false` to `if: true` once HOMELAB_* secrets are set.
    # -------------------------------------------------------------------
    if: false
    environment: production

    steps:
      - name: Checkout (for Makefile access)
        uses: actions/checkout@v4

      - name: Backup SQLite before deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOMELAB_SSH_HOST }}
          username: ${{ secrets.HOMELAB_SSH_USER }}
          key: ${{ secrets.HOMELAB_SSH_KEY }}
          port: ${{ secrets.HOMELAB_SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.HOMELAB_DEPLOY_PATH }}
            make backup

      - name: Pull new image and recreate container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOMELAB_SSH_HOST }}
          username: ${{ secrets.HOMELAB_SSH_USER }}
          key: ${{ secrets.HOMELAB_SSH_KEY }}
          port: ${{ secrets.HOMELAB_SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.HOMELAB_DEPLOY_PATH }}
            # Log in to GHCR on the server so it can pull the new image
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Pull the exact image built for this commit
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            # Update docker-compose to use this specific image (avoid :latest drift)
            export LEDGERLIFT_IMAGE=ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker compose up --force-recreate -d
            # Confirm the container is healthy
            docker compose ps ledgerlift
